<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Plateforme de RH Manini Inc - Démarrez votre carrière">
    <title>RH Manini Inc - Page d'accueil</title>
    <!-- Preload critical assets -->
    <link rel="preload" href="static/css/style.css" as="style">
    <link rel="preload" href="static/img/background-img.jpg" as="image">
    <link rel="preload" href="/static/icons/css/fontawesome.css" as="style">
    <link rel="preload" href="/static/icons/css/brands.css" as="style">
    <link rel="preload" href="/static/icons/css/solid.css" as="style">

    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="static/css/agent.css">
    <!-- Font Awesome Icons-->
    <link href="/static/icons/css/fontawesome.css" rel="stylesheet" />
    <link href="/static/icons/css/brands.css" rel="stylesheet" />
    <link href="/static/icons/css/solid.css" rel="stylesheet" />
    <meta name="csrf-token" content="{{ csrf_token }}">
</head>

<body>
    <div class="main-container">
        {% include 'header.html' %}
        <main>
            <section class="main-content">
                {% include 'acces-rapide.html' %}
                <div class="agent-main-container">
                    <form class="search-bar-container" method="" action="" role="search">
                        <input type="search" id="job-search" class="search-bar"
                            placeholder="Quel fonctionnalité recherchez-vous ?" aria-label="Rechercher un poste">
                        <button class="search-bar-btn" type="submit" aria-label="Rechercher">
                            <i class="icon search-icon fa-solid fa-search"></i>
                        </button>
                    </form>
                    <div class="fonctionnalites-container">
                        {% for fonctionnalite in fonctionnalites %}
                        <a href="{{ fonctionnalite.fonctionnalite_lien }}" class="fonctionnalite">
                            <i class="{{ fonctionnalite.fonctionnalite_logo }}"></i>
                            <span>{{ fonctionnalite.fonctionnalite_titre }}</span>
                        </a>
                        {% endfor %}
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="static/js/acces-rapide.js"></script>
</body>

</html>
