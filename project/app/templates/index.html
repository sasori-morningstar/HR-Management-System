<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Plateforme de RH Manini Inc - Démarrez votre carrière">
    <title>RH Manini Inc - Page d'accueil</title>
    <!-- Preload critical assets -->
    <link rel="preload" href="static/css/style.css" as="style">
    <link rel="preload" href="static/img/background-img.jpg" as="image">
    <link rel="preload" href="/static/icons/css/fontawesome.css" as="style">
    <link rel="preload" href="/static/icons/css/brands.css" as="style">
    <link rel="preload" href="/static/icons/css/solid.css" as="style">

    <link rel="stylesheet" href="static/css/style.css">
    <!-- Font Awesome Icons-->
    <link href="/static/icons/css/fontawesome.css" rel="stylesheet" />
    <link href="/static/icons/css/brands.css" rel="stylesheet" />
    <link href="/static/icons/css/solid.css" rel="stylesheet" />
</head>

<body>
    <div class="main-container">
        <header>
            <div class="logo">
                <h1>RH</h1>
                <h3 class="company-name">@Manini Inc</h3>
            </div>
            <nav class="auth-btns" aria-label="Authentification">
                <ul>
                    <li><a href="#" class="btn-register">S'enregistrer</a></li>
                    <li><a href="#" class="btn-login">S'authentifier</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <section class="main-content">
                <img src="static/img/landing-page-pic1.png" alt="Réseau des employés collaborant ensemble" />
                <h2 class="main-heading">Qu'attendez vous? <span class="blue-text">Rejoignez-nous</span> maintenant !
                </h2>
                <form class="search-bar-container" method="GET" action="#" role="search">
                    <input type="search" id="job-search" class="search-bar" placeholder="Quel poste recherchez-vous ?"
                        aria-label="Rechercher un poste">
                    <button class="search-bar-btn" type="submit" aria-label="Rechercher">
                        <i class="icon search-icon fa-solid fa-search"></i>
                    </button>
                </form>
                <a class="voir-offres-btn" href="#">
                    <i class="icon recrutement-icon fa-solid fa-briefcase"></i>
                    <span>Voir tous les offres disponibles</span>
                </a>
            </section>
        </main>
    </div>
</body>

</html>
